site_name: Validibot Dev Docs
site_description: Internal documentation for Validibot contributors.
site_url: https://dev.validibot.com/
site_author: Daniel McQuillen

docs_dir: docs/dev_docs
site_dir: docs_build/dev
use_directory_urls: true

dev_addr: 127.0.0.1:9000

repo_url: https://github.com/mcquilleninteractive/validibot
repo_name: mcquilleninteractive/validibot
# Dev docs live in the public repo, so every page gets a working
# "edit this page" pencil (content.action.edit below).
edit_uri: edit/main/docs/dev_docs/

theme:
  name: material
  custom_dir: docs/dev_docs/overrides
  language: en
  favicon: images/favicon.png
  font: false
  palette:
    # Light mode (default). The toggle pair gives readers a dark mode.
    # Brand colors for the slate scheme live in stylesheets/extra.css.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.path
    - navigation.footer
    - navigation.top
    - navigation.sections
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.action.view
    - announce.dismiss

extra_css:
  - stylesheets/fonts.css
  - stylesheets/extra.css

extra:
  homepage: https://validibot.com
  social:
    - icon: fontawesome/solid/globe
      link: https://validibot.com
      name: Validibot.com

plugins:
  - search

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

