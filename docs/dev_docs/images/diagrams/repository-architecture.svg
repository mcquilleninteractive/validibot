  <text class="detail" x="1307.5" y="196">Pydantic envelope models</text>

  <rect class="node-green" x="1170" y="350" width="275" height="125" rx="14"/>
  <text class="label" x="1307.5" y="391">Validator backends</text>
  <text class="detail" x="1307.5" y="420">advanced validator</text>
  <text class="detail" x="1307.5" y="444">containers</text>

  <rect class="group-commercial" x="385" y="690" width="720" height="220" rx="18"/>
