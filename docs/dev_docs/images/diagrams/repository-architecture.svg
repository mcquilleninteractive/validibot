<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1500 960"
     role="img"
     aria-labelledby="repository-architecture-title repository-architecture-description">
  <title id="repository-architecture-title">Complete Validibot project architecture</title>
  <desc id="repository-architecture-description">
    Web users, API users, user AI agents, and the Validibot command-line
    interface send requests to the community Django application. The official
    MCP SDK and its ASGI route are embedded inside Django and call application
    services directly. Thin Pro and Enterprise packages register licenses and
    features. Validibot Cloud imports Pro and overlays settings on Django. The
    community application and validator backends use validibot-shared.
  </desc>
  <defs>
    <style>
      .background { fill: #f8fafc; }
      .group-community { fill: #eef5ff; stroke: #2563eb; stroke-width: 2; }
      .group-commercial { fill: #f7f1ff; stroke: #7c3aed; stroke-width: 2; }
      .node { fill: #ffffff; stroke: #7890b4; stroke-width: 2; }
      .node-blue { fill: #e8f1ff; stroke: #2563eb; stroke-width: 2; }
      .node-green { fill: #ecfdf3; stroke: #15803d; stroke-width: 2; }
      .node-orange { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; }
      .node-purple { fill: #f5f0ff; stroke: #7c3aed; stroke-width: 2; }
      .title { fill: #172033; font: 700 28px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .subtitle { fill: #526079; font: 16px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .group-title-blue { fill: #1d4ed8; font: 700 18px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .group-title-purple { fill: #6d28d9; font: 700 18px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .section-title { fill: #394762; font: 700 15px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label { fill: #172033; font: 700 17px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .source-label { fill: #172033; font: 700 15px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .detail { fill: #526079; font: 14px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .edge-label { fill: #394762; font: 13px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .edge { fill: none; stroke: #526b94; stroke-width: 2.1; marker-end: url(#arrow); }
      .edge-purple { fill: none; stroke: #7c3aed; stroke-width: 2.1; marker-end: url(#arrow-purple); }
      .edge-dashed { fill: none; stroke: #7c3aed; stroke-width: 2.1; stroke-dasharray: 8 6; marker-end: url(#arrow-purple); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#526b94"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect class="background" width="1500" height="960" rx="20"/>
  <text class="title" x="50" y="48">Validibot project architecture</text>
  <text class="subtitle" x="50" y="76">Business logic stays in community; users and tools enter the Django application through web, API, or MCP.</text>

