  <text class="label" x="567.5" y="802">validibot-pro</text>
  <text class="detail" x="567.5" y="831">Pro license and features</text>

  <rect class="node-purple" x="785" y="760" width="275" height="105" rx="14"/>
  <text class="label" x="922.5" y="802">validibot-enterprise</text>
  <text class="detail" x="922.5" y="831">Enterprise license and SSO</text>

  <rect class="node-orange" x="45" y="735" width="280" height="130" rx="14"/>
  <text class="label" x="185" y="776">validibot-cloud</text>
  <text class="detail" x="185" y="805">billing · metering</text>
  <text class="detail" x="185" y="829">tenancy · hosted runs</text>

