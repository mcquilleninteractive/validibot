<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1500 800"
     role="img"
     aria-labelledby="repository-overview-title repository-overview-description">
  <title id="repository-overview-title">Validibot repository architecture overview</title>
  <desc id="repository-overview-description">
    Web users, API users, user AI agents, and the Validibot command-line
    interface send requests to the community Django application. The official
    MCP SDK and its ASGI route are embedded inside the Django application and
    call Django services directly. Django uses validibot-shared and dispatches
    advanced validation runs to validator backend containers. Commercial
    packages unlock gated features in the Django application.
  </desc>
  <defs>
    <style>
      .background { fill: #f8fafc; }
      .group { fill: #eef5ff; stroke: #2563eb; stroke-width: 2; }
      .node { fill: #ffffff; stroke: #7890b4; stroke-width: 2; }
      .node-blue { fill: #e8f1ff; stroke: #2563eb; stroke-width: 2; }
      .node-green { fill: #ecfdf3; stroke: #15803d; stroke-width: 2; }
      .node-purple { fill: #f5f0ff; stroke: #7c3aed; stroke-width: 2; }
      .title { fill: #172033; font: 700 28px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .subtitle { fill: #526079; font: 16px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .group-title { fill: #1d4ed8; font: 700 18px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .section-title { fill: #394762; font: 700 15px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label { fill: #172033; font: 700 18px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .source-label { fill: #172033; font: 700 15px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .detail { fill: #526079; font: 15px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .edge-label { fill: #394762; font: 14px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .edge { fill: none; stroke: #526b94; stroke-width: 2.2; marker-end: url(#arrow); }
      .edge-dashed { fill: none; stroke: #7c3aed; stroke-width: 2.2; stroke-dasharray: 8 6; marker-end: url(#arrow-purple); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#526b94"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect class="background" width="1500" height="800" rx="20"/>
  <text class="title" x="52" y="50">How the Validibot repositories fit together</text>
  <text class="subtitle" x="52" y="78">Core validation stays in the community application; users and tools enter through web, API, or MCP.</text>

  <text class="section-title" x="55" y="205">Incoming requests</text>

  <rect class="node" x="55" y="225" width="275" height="50" rx="12"/>
  <text class="source-label" x="192.5" y="256">User (web)</text>

  <rect class="node" x="55" y="295" width="275" height="50" rx="12"/>
  <text class="source-label" x="192.5" y="326">User (API)</text>

  <rect class="node" x="55" y="365" width="275" height="50" rx="12"/>
  <text class="source-label" x="192.5" y="396">User AI agent (MCP)</text>

  <rect class="node" x="55" y="435" width="275" height="50" rx="12"/>
  <text class="source-label" x="192.5" y="466">validibot-cli (API)</text>

  <rect class="group" x="405" y="95" width="700" height="450" rx="18"/>
  <text class="group-title" x="435" y="130">validibot · community repository · AGPL-3.0</text>

  <rect class="node-blue" x="445" y="155" width="620" height="345" rx="16"/>
  <text class="label" x="755" y="192">Django application</text>
  <text class="detail" x="755" y="219">web UI · REST API · workflows · validators · findings</text>

  <rect class="node" x="500" y="350" width="235" height="85" rx="12"/>
  <text class="label" x="617.5" y="385">Embedded MCP</text>
  <text class="detail" x="617.5" y="413">official SDK · ASGI /mcp</text>

  <rect class="node" x="790" y="245" width="230" height="220" rx="12"/>
  <text class="label" x="905" y="285">Django services</text>
  <text class="detail" x="905" y="316">auth · policy · launch</text>
  <text class="detail" x="905" y="342">application logic</text>

  <rect class="node-green" x="1170" y="120" width="275" height="120" rx="14"/>
  <text class="label" x="1307.5" y="163">Validator backends</text>
  <text class="detail" x="1307.5" y="193">advanced validator</text>
  <text class="detail" x="1307.5" y="216">containers</text>

  <rect class="node" x="1170" y="345" width="275" height="105" rx="14"/>
  <text class="label" x="1307.5" y="387">validibot-shared</text>
  <text class="detail" x="1307.5" y="417">Pydantic envelope models</text>

  <rect class="node-purple" x="500" y="645" width="510" height="105" rx="14"/>
  <text class="label" x="755" y="687">validibot-pro · validibot-enterprise</text>
  <text class="detail" x="755" y="717">thin commercial activation layers</text>

  <path class="edge" d="M 330 250 H 790"/>
  <path class="edge" d="M 330 320 H 790"/>
  <path class="edge" d="M 330 390 H 500"/>
  <path class="edge" d="M 330 460 H 790"/>

  <path class="edge" d="M 735 392.5 H 790"/>
  <text class="edge-label" x="762" y="381">direct</text>

  <path class="edge" d="M 1020 270 C 1085 210, 1115 185, 1170 180"/>
  <text class="edge-label" x="1096" y="205">dispatches runs</text>

  <path class="edge" d="M 1020 410 C 1080 410, 1115 397.5, 1170 397.5"/>
  <text class="edge-label" x="1094" y="430">uses</text>

  <path class="edge" d="M 1307.5 240 V 345"/>
  <text class="edge-label" x="1345" y="298">uses</text>

  <path class="edge-dashed" d="M 755 645 V 545"/>
  <text class="edge-label" x="850" y="600">unlocks gated features</text>
</svg>
