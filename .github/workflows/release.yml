# Release the Validibot Django application as a verified source bundle.
#
# Validibot is installed from source rather than PyPI. A release therefore
# consists of one source archive, two CycloneDX SBOMs, flat checksums, and a
# GitHub artifact attestation. The archive is built once and the exact same
# bytes flow through attestation and publication.
#
# Trust boundary: the signer allowlist is read from protected origin/main, not
# from the tag being verified. The tag commit must also be an ancestor of that
# protected branch. This makes protected main the out-of-band trust anchor and
# prevents a tag from authorizing its own replacement signer file.

name: Release validibot

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build verified release bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout the triggering tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release identity and signed tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must exactly match vX.Y.Z."
            exit 1
          fi

          TAG_COMMIT="$(git rev-list -n 1 "$RELEASE_TAG")"
          if [[ "$TAG_COMMIT" != "$TRIGGER_SHA" ]] || [[ "$TAG_COMMIT" != "$(git rev-parse HEAD)" ]]; then
            echo "::error::Trigger, tag, and checkout do not identify the same commit."
            exit 1
          fi

          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "::error::Release tag commit is not on protected origin/main."
            exit 1
          fi

          TRUSTED_SIGNERS="$RUNNER_TEMP/validibot-allowed-signers"
          git show origin/main:.allowed_signers > "$TRUSTED_SIGNERS"
          git \
            -c gpg.format=ssh \
            -c gpg.ssh.allowedSignersFile="$TRUSTED_SIGNERS" \
            verify-tag "$RELEASE_TAG"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: '.python-version'

      - name: Install locked dependencies
        run: uv sync --group dev --frozen

      - name: Build source archive, SBOMs, and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          mkdir release

          git archive \
            --format=tar.gz \
            --prefix="validibot-${VERSION}/" \
            "$RELEASE_TAG" \
            > "release/validibot-${VERSION}.tar.gz"

          uvx --from cyclonedx-bom==7.3.1 cyclonedx-py environment \
            --output-format JSON \
            --output-file release/validibot.cdx.json
          uvx --from cyclonedx-bom==7.3.1 cyclonedx-py environment \
            --output-format XML \
            --output-file release/validibot.cdx.xml

          (
            cd release
            sha256sum \
              "validibot-${VERSION}.tar.gz" \
              validibot.cdx.json \
              validibot.cdx.xml \
              > SHA256SUMS
          )

      - name: Upload immutable release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: validibot-release-${{ github.ref_name }}
          path: release/
          if-no-files-found: error
          retention-days: 90

  evidence:
    name: Attest and publish release
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Download verified release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: validibot-release-${{ github.ref_name }}
          path: release/

      - name: Attest source archive and SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: release/validibot-*.tar.gz
          sbom-path: release/validibot.cdx.json

      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TAG" \
            --generate-notes \
            --verify-tag
