name: Docs

# The main CI workflow now runs for every pull request, including docs-only
# changes, so the stable `ci` aggregate is always present. Documentation
# changes also get this dedicated fast guard with two checks:
#
#   1. scripts/check_doc_links.py — every relative markdown link must
#      resolve to a real file (the June 2026 docs audit found links to
#      files that had been renamed or never existed).
#   2. zensical build — the dev-docs site must build cleanly with the
#      exact pinned version used for publishing, so a bad mkdocs.dev.yml
#      or nav entry can't land and break the next docs-sync.

permissions:
  contents: read

on:
  pull_request:
    branches: ['master', 'main']
    paths:
      - 'docs/**'
      - '*.md'
      - 'mkdocs*.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build_docs_assets.mjs'
      - 'scripts/harden_docs_build.mjs'
      - 'scripts/check_doc_links.py'
      - 'tests/test_docs_supply_chain.py'
      - '.github/workflows/docs.yml'
  push:
    branches: ['master', 'main']
    paths:
      - 'docs/**'
      - '*.md'
      - 'mkdocs*.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build_docs_assets.mjs'
      - 'scripts/harden_docs_build.mjs'
      - 'scripts/check_doc_links.py'
      - 'tests/test_docs_supply_chain.py'
      - '.github/workflows/docs.yml'

concurrency:
  group: docs-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: '.python-version'

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Check relative links in markdown docs
        run: python scripts/check_doc_links.py

      - name: Verify local documentation assets
        run: |
          npm ci
          npm run build:docs-assets
          python -m unittest tests/test_docs_supply_chain.py
          git diff --exit-code -- \
            docs/dev_docs/fonts/ \
            docs/dev_docs/images/favicon.png

      # Install zensical from a fully hash-pinned requirements file so the
      # docs build is reproducible and tamper-evident (OSSF Scorecard
      # Pinned-Dependencies). The version must stay in sync with the zensical
      # pin in pyproject.toml — publishing uses that version, so CI proves the
      # same one builds. To bump: edit requirements/docs.in and regenerate
      # requirements/docs.txt (command in that file's header).
      - name: Build dev docs site
        run: |
          pip install --require-hashes -r requirements/docs.txt
          zensical build -f mkdocs.dev.yml --clean
          npm run harden:docs-build
