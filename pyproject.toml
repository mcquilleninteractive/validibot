[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

# Source releases must never include local virtual environments or frontend
# dependency trees. Hatch does not use .gitignore as the complete source
# archive boundary, and the local .venv contains absolute interpreter links
# that make the archive invalid on another machine.
[tool.hatch.build]
exclude = [
  "/.venv",
  "/.uv-cache",
  "/.uv_cache",
  "/.pytest_cache",
  "/.ruff_cache",
  "/.mypy_cache",
  "/node_modules",
  "/mcp/.venv",
  "/mcp/.pytest_cache",
  "/mcp/.ruff_cache",
]

# ==== Project metadata ====

[project]
name = "validibot"
version = "0.16.4"
description = "Open-source data validation platform"
requires-python = ">=3.13"
license = { text = "AGPL-3.0-only" }
authors = [
  { name = "Daniel McQuillen", email = "daniel@mcquilleninteractive.com" },
  { name = "McQuillen Interactive Pty. Ltd." },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Django :: 6.0",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
]
keywords = ["validibot", "validation", "django", "data-validation"]

dependencies = [
  "argon2-cffi==25.1.0",
  "authlib==1.8.0",
  "cel-python==0.5.0",
  "crispy-bootstrap5==2026.3",
  "cryptography==50.0.1",
  "defusedxml==0.7.1",
  "django==6.0.7",
  "django-allauth[mfa]==65.19.1",
  "django-anymail[postmark]==15.1",
  "django-cors-headers==4.9.0",
  "django-crispy-forms==2.7",
  "django-environ==0.14.0",
  "django-filter==26.1",
  "django-markdownify==0.9.7",
  "django-model-utils==5.0.0",
  "django-storages[google]==1.14.6",
  "djangorestframework==3.18.0",
  # Async DNS keeps MCP attachment lookups inside the same total deadline as
  # redirects, connection establishment, and streamed response reads.
  "dnspython==2.8.0",
  "drf-spectacular[sidecar]==0.30.0",
  "fmpy==0.3.31",
  # Directly used to exchange worker ADC for attempt-scoped GCS Credential
  # Access Boundary tokens. Do not rely on django-storages pulling it in.
  "google-auth==2.57.0",
  "google-cloud-kms==3.16.0",
  "google-cloud-tasks==2.24.0",
  # RE2 regex engine: linear-time, no catastrophic backtracking. Used by
  # validibot.validations.regex_safety to run author-supplied patterns (Basic
  # validator regex, Tabular column `pattern`) against submitter data without a
  # ReDoS risk. Previously present only transitively; declared here because we
  # now import it directly.
  "google-re2==1.1.20251105",
  "gunicorn==26.2.0",
  "httpx==0.28.1",
  "jsonschema==4.26.0",
  "lxml==6.1.2",
  "markdown2==2.5.5",
  # Official Model Context Protocol SDK. Validibot owns its curated tool
  # contract; this dependency owns Streamable HTTP and the MCP wire protocol.
  "mcp==2.1.1",
  "nh3==0.3.7",
  "pillow==12.3.0",
  "psycopg[c]==3.3.5",
  "pydantic==2.13.5",
  "python-jsonpath==2.2.1",
  "python-slugify==8.0.4",
  "sentry-sdk==2.68.1",
  # Task queue: Celery with Redis broker and periodic scheduling.
  # celery[redis] pulls in kombu's redis extra, which caps the redis version.
  # As of kombu 5.6.2 the cap is redis<6.5; kombu main has bumped to <7.1
  # but hasn't released yet. Don't add a separate redis pin here.
  "celery[redis]==5.6.3",
  # django-celery-beat 2.9.0 (2026-02-28) ships Django 6.0 support on PyPI, so
  # we pin the released version directly — the earlier Git override for the
  # (then-unreleased) PR #978 is no longer needed.
  # See: https://github.com/celery/django-celery-beat/issues/977
  "django-celery-beat==2.9.0",
  "uvicorn-worker==0.4.0",
  "uvicorn[standard]==0.52.4",
  "whitenoise==6.12.0",
  "google-cloud-run==0.16.1",
  "python-json-logger==4.2.0",
  "django-recaptcha==4.1.0",
  # Maintained blocklist of ~2800 throwaway email domains (mailinator,
  # guerrillamail, tempmail, etc). Used by UserSignupForm when
  # REJECT_DISPOSABLE_EMAILS is enabled — off by default for community/
  # self-hosted deployments, on in cloud to deter free-trial abuse.
  "disposable-email-domains==0.0.247",
  # validibot-shared: Our shared library for Validibot integrations (e.g., EnergyPlus).
  # 0.7.0 adds ``StepValidatorRecord.validator_backend_image_digest``;
  # 0.7.1–0.7.3 shipped publish-workflow fixes;
  # 0.7.4 adds the optional ``EvidenceManifest.source`` field that
  # documents the auth channel that produced each run;
  # 0.8.0 is the ADR-2026-05-22 catalog cleanup: removes
  # ``EnergyPlusSimulationMetrics.zone_count`` (which is a step input
  # under the provenance rule, not a step output) and renames
  # ``floor_area_m2`` → ``simulated_conditioned_area_m2`` so the field
  # name disambiguates the simulation-derived value from any
  # design-floor-area input the IDF declares. Both changes are
  # breaking for envelope consumers; the catalog v1.1 already reflects
  # the new shape.
  # 0.9.0 adds the SHACL Advanced-validator envelopes (SHACLInputEnvelope/
  # SHACLOutputEnvelope, SHACLInputs/SHACLOutputs, SHACLFinding,
  # SHACLSparqlAssertionSpec) plus ValidatorType.SHACL and RDF MIME types —
  # the contract for running SHACL in the isolated container backend.
  # 0.12.0 is the Schematron contract (ADR-2026-07-01, upload model):
  # SchematronInputs ship the author's rules inline as ``schematron_text``
  # (the SHACL shapes_text pattern), SchematronOutputs carry the D9
  # engine-status taxonomy + SVRL summary, and the canonical SVRL parser
  # (``validibot_shared.schematron.svrl``) lives here so Django and the
  # container backend parse SVRL identically.
  # 0.12.1 adds the shared RFC 8785 / JCS canonicalization helper used by
  # workflow-definition contract hashes, keeping community evidence and Pro
  # credentials on the same portable byte contract.
  # 0.13.0 adds shared ArtifactRef/FilePortContract schemas and optional
  # port_key fields on envelope file/resource items for the artifact-port
  # workflow-engine slice.
  # 0.15.0 makes execution-attempt identity, the canonical input-envelope
  # digest, and the exact expected output URI mandatory across every advanced
  # validator input/output envelope.
  # 0.18.0 adds URI-free attempt/input evidence models and artifact storage
  # versions to the strict file-identity contract introduced in 0.16.0.
  # 0.19.0 records the immutable execution deployment selected for each
  # managed attempt in portable evidence manifests.
  # 0.21.0 adds independent backend-release evidence identity and makes the
  # Portfolio Manager policy contract fully explicit.
  # 0.22.0 preserves that contract while moving publication to the hardened
  # organization-owned, signed-tag, single-artifact release pipeline.
  # 0.23.0 adds the minimal permanent evidence receipt and its optional
  # per-step backend image identity.
  # 0.28.0 adds the final shared evidence-contract refinements used by the
  # application and validator backends.
  "validibot-shared==0.28.0",
  "django-csp==4.0",
  "django-permissions-policy==4.33.0",
  # OIDC provider runtime deps. allauth.idp.oidc is unconditionally in
  # INSTALLED_APPS (community's `validibot.idp` app extends the allauth
  # adapter for the MCP helper API's JWT access tokens), so these are
  # base deps — without oauthlib the test suite can't even collect the
  # idp tests. Previously declared under the cloud extra back when idp
  # only ran in the hosted offering.
  "oauthlib==3.3.1",
  "pyjwt[crypto]==2.13.0",
  # Django still uses rdflib for SHACL authoring-time syntax checks and
  # SPARQL security scrubbing. pySHACL/owlrl execution dependencies live in
  # validibot-validator-backends now that SHACL runs in an isolated backend.
  "rdflib==7.6.0",
  # NOTE: defusedxml is already listed above as a base dep (used elsewhere
  # in the platform) — it is load-bearing for the SHACL validator's
  # RDF/XML hardening against XXE / billion-laughs / external-DTD attacks.
  # See ADR-2026-05-18 "Security" section.
  "pandas==3.0.5",
]

[project.optional-dependencies]
cloud = [
  "stripe==15.6.0",
]
# Docker SDK for the Docker-based validator runner (VALIDATOR_RUNNER=docker).
# Not needed for Cloud Run deployments. Reduces attack surface when omitted.
docker-runner = ["docker==7.2.0"]

[project.urls]
Homepage = "https://validibot.com"
Documentation = "https://validibot.com/resources/docs/"
Repository = "https://github.com/mcquilleninteractive/validibot"

# ==== pytest ====
[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--ds=config.settings.test --reuse-db --import-mode=importlib -ra -m 'not smoke'"
python_files = ["tests.py", "test_*.py"]
testpaths = [
  "tests",
  "validibot",
]
markers = [
  "integration: marks tests as integration (may require platform-specific binaries)",
  "smoke: marks tests as smoke tests (run with -m smoke, skipped by default)",
]
filterwarnings = [
  "error",
  # WhiteNoise warns when staticfiles/ doesn't exist (harmless in tests)
  "ignore:No directory at.*staticfiles:UserWarning",
  # psycopg3 may leave sockets unclosed between tests (Python 3.13 strict mode)
  "ignore::ResourceWarning",
]

# These test directories are excluded from normal pytest runs.
# Integration tests: just test-integration
# E2E stress tests: just test-e2e (see docs/dev_docs/how-to/run-e2e-tests.md)
norecursedirs = [
  "tests/tests_integration",
  "tests/tests_e2e",
]

# ==== Coverage ====
[tool.coverage.run]
include = ["validibot/**"]
omit = [
  "*/migrations/*",
  "*/tests/*",
]
plugins = ["django_coverage_plugin"]

# ==== mypy ====
[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]

[[tool.mypy.overrides]]
# Django migrations should not produce any errors:
module = "*.migrations.*"
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

# ==== djLint ====
[tool.djlint]
blank_line_after_tag = "load,extends"
close_void_tags = true
format_attribute_template_tags = true
format_css = true
format_js = true
line_break_after_multiline_tag = true
max_blank_lines = 2
# TODO: remove T002 when fixed https://github.com/djlint/djLint/issues/687
# H021: Inline styles (Chart.js containers, Bootstrap overrides)
# H025: False positives on Django template tag nesting
# H037: False positives on Django template tag attributes (e.g., pk=obj.pk)
# H020: Empty tag pairs (used for spacing/icons in Bootstrap)
ignore = "H006,H030,H031,T002,H021,H025,H037,H020"
# Exclude widget templates where djlint's reformatter breaks the
# attribute rendering loop (splits {{ name }}="{{ value }}" across
# lines, producing invalid HTML attributes).
extend_exclude = "users/widgets"
include = "H017,H035"
indent = 2
max_line_length = 119
profile = "django"

[tool.djlint.css]
indent_size = 2

[tool.djlint.js]
indent_size = 2

[tool.ruff]
target-version = "py313"
# Exclude a variety of commonly ignored directories.
extend-exclude = ["*/migrations/*.py", "staticfiles/*", "scripts/*", "deploy/self-hosted/scripts/*", "tests/assets/*"]

[tool.ruff.lint]
select = [
  "F",
  "E",
  "W",
  "C90",
  "I",
  "N",
  "UP",
  "YTT",
  # "ANN", # flake8-annotations: we should support this in the future but 100+ errors atm
  "ASYNC",
  "S",
  "BLE",
  "FBT",
  "B",
  "A",
  "COM",
  "C4",
  "DTZ",
  "T10",
  "DJ",
  "EM",
  "EXE",
  "FA",
  'ISC',
  "ICN",
  "G",
  'INP',
  'PIE',
  "T20",
  'PYI',
  'PT',
  "Q",
  "RSE",
  "RET",
  "SLF",
  "SLOT",
  "SIM",
  "TID",
  "TC",
  "INT",
  # "ARG", # Unused function argument
  "PTH",
  "ERA",
  "PD",
  "PGH",
  "PL",
  "TRY",
  "FLY",
  # "NPY",
  # "AIR",
  "PERF",
  # "FURB",
  # "LOG",
  "RUF",
]
ignore = [
  "S101",   # Use of assert detected https://docs.astral.sh/ruff/rules/assert/
  "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
  "SIM102", # sometimes it's better to nest
  # of types for comparison.
  # Deactivated because it can make the code slow:
  # https://github.com/astral-sh/ruff/issues/7871
  "TRY003",  # Use of bare except
  "EM102",
  "PT009",   # don't comment about tests using assertEqual etc
  "RET504",  #Unnecessary assignment to `filename` before `return` statement
  "ERA001",  # We want to put code in comments
  "C901",    # 'Function is too complex' ... I want to have some functions that have more than 6 args.
  "PLR0913", # Function has too many arguments (14/10)
  "BLE001",  #We want blind exceptions
  "PLR0912", # Too many branches (13/12)
  "PLR0911", # Too many statements (50/50)
  "EM101",   # Allow use of 'print' function
  "W293",    # blank line contains whitespace
  "W291",    # trailing whitespace
  "PLR0915", # Too many statements in a class (112/100)
  "PLR0917", # Ratchet positional-argument limits before enforcing repository-wide
  "RUF059",  # Allow use of dataclass with mutable default values
  "PLC0415", # Allow imports in places other than top of file
  "C416",    # Allow Unnecessary dict comprehension (rewrite using `dict()`)
  "COM812",  # Allow Trailing comma missing
  "ISC004",  # Ratchet string-concatenation style before enforcing repository-wide
  "PERF401", # Allow use of list comprehensions that could be replaced with generator expressions
  "G004",    # Allow f-strings in logging statements
  "SLF001",  # Allow private member access across modules
  "RUF001",  # Allow ambiguous unicode characters in strings (e.g. curly quotes, em dashes)
  "RUF002",  # Allow ambiguous unicode characters in docstrings
  "RUF003",  # Allow ambiguous unicode characters in comments
]

[tool.ruff.lint.isort]
force-single-line = true

[dependency-groups]
dev = [
  # Testing
  "coverage==7.16.0",
  "django-coverage-plugin==3.2.2",
  "factory-boy==3.3.3",
  "pytest==9.1.1",
  "pytest-django==4.14.0",
  "pytest-sugar==1.1.1",
  "selenium==4.48.0",
  # Linting and formatting
  "djlint==1.44.2",
  "pre-commit==4.6.2",
  "ruff==0.16.5",
  # Type checking
  "django-stubs[compatible-mypy]==6.1.0",
  "djangorestframework-stubs==3.18.1",
  "mypy==2.3.1",
  # Debugging and development utilities
  "django-debug-toolbar==7.1.1",
  "django-extensions==4.1",
  "ipdb==0.13.13",
  "watchfiles==1.2.0",
  "werkzeug[watchdog]==3.1.8",

]

# Documentation tooling — intentionally NOT in `dev` and NOT a default group.
# Zensical is a host-only static-site generator for building/previewing the
# developer docs (`just local docs-build` / `docs-dev`). Its own opt-in group
# keeps it out of the default dev environment AND out of the local Docker image
# (which syncs `--group dev`). Install on demand with `uv sync --group docs`, or
# just run a docs recipe (it pulls the group). CI builds docs from the
# hash-pinned requirements/docs.txt, independent of this group.
docs = [
  # Documentation
  "zensical==0.0.57",
]
